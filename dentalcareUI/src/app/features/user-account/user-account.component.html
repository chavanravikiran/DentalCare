<div class="flex justify-end">
  <button
    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded"
    (click)="logout()"
  >
    🔒 Log out
  </button>
</div>

<div class="p-6 space-y-6">
  <h2 class="text-2xl font-semibold">Welcome to your personal space 🦷</h2>

  <!-- Next appointment-->
  <section class="bg-white p-4 rounded shadow">
    <h3 class="text-xl font-medium mb-2">📅 Your next appointment</h3>
    <p>You have an appointment scheduled for <strong>April 15th at 3:30 PM</strong> with Dr. Zahra.</p>
    <a routerLink="/user-account/appointments" class="text-blue-600 hover:underline">View all my appointments</a>
  </section>

  <!-- Recent documents -->
  <section class="bg-white p-4 rounded shadow">
    <h3 class="text-xl font-medium mb-2">📄 Latest medical documents</h3>
    <ul class="list-disc pl-5">
      <li>Order of 03/04 <button class="text-blue-500">Download</button></li>
      <li>Panoramic radio <button class="text-blue-500">Download</button></li>
    </ul>
    <a routerLink="/user-account/documents" class="text-blue-600 hover:underline">Voir tous mes documents</a>
  </section>

  <!-- Quick message -->
  <section class="bg-white p-4 rounded shadow">
    <h3 class="text-xl font-medium mb-2">✉️ Contact the office</h3>
    <a routerLink="/user-account/messaging" class="text-blue-600 hover:underline">Send a message</a>
  </section>
</div>
