<!-- Enhanced Top Header -->
<div class="top-header text-white text-sm py-3">
  <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
    <ul class="flex flex-wrap gap-6 mb-2 md:mb-0 items-center">
      <li class="flex items-center">
        <i class="bx bxs-map mr-2"></i>
         <span>{{ websiteDetails?.shortAddress }}</span>
      </li>
      <li class="flex items-center">
        <i class="bx bx-envelope mr-2"></i>
        <a class="hover:text-cyan-200 transition-all duration-300" [href]="'mailto:' + websiteDetails?.email">
          {{ websiteDetails?.email }}
        </a>
      </li>
    </ul>
    
    <div class="social-links flex items-center gap-3">
      <a *ngFor="let social of websiteDetails?.socialLinks"
        [href]="social.url"
        target="_blank"
        class="hover:scale-110 transition-all duration-300"
        [attr.aria-label]="social.platform">
        <i class="bx bxl-instagram text-lg" [ngClass]="social.icon"></i>
      </a>
    </div>
  </div>
</div>

<!-- Enhanced Middle Header -->
<div class="middle-header-area py-6">
  <div class="container mx-auto px-4 flex flex-col lg:flex-row justify-between items-center">
    <h1 class="text-4xl lg:text-5xl font-bold mb-4 lg:mb-0">
      <a routerLink="/" class="hover:opacity-80 transition-opacity duration-300">
        {{websiteDetails?.websiteName}}
      </a>
    </h1>

    <div class="flex flex-col md:flex-row gap-6">
      <div class="contact-info flex items-center gap-4">
        <i class="bx bx-phone-call"></i>
        <div>
          <div class="contact-info-text">Call us today</div>
          <a [href]="'tel:' + websiteDetails?.phone" class="contact-info-value">
            {{ websiteDetails?.phone }}
          </a>
        </div>
      </div>

      <div class="contact-info flex items-center gap-4">
        <i class="bx bx-time-five"></i>
        <div>
          <div class="contact-info-text">Opening Hours</div>
           <!-- <div class="contact-info-value">{{ websiteDetails?.openingHours }}</div> -->
           <div class="contact-info-value"
              [innerHTML]="websiteDetails?.openingHours">
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
